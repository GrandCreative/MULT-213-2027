<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids Passing Earth Today</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b0d17;
      color: #e8e8f0;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: 0.25rem; }
    #summary { color: #8a8fb0; margin-top: 0; }
    #status { color: #ff8a80; }
    #asteroids {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #161a2e;
      border: 1px solid #2a2f4a;
      border-radius: 8px;
      padding: 1rem;
    }
    .card h2 { font-size: 1.1rem; margin: 0 0 0.5rem; }
    .card p { margin: 0.25rem 0; }
    .hazard { border-color: #ff8a80; }
    .hazard-label { color: #ff8a80; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Asteroids Passing Earth Today</h1>
  <p id="summary"></p>
  <p id="status">Loading...</p>

  <div id="asteroids"></div>

  <!-- config.js holds your API key. It must load BEFORE script.js. -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
