<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JavaScript Quest</title>
<style>
  /* ============================================================
     Colours: "meadow" (light) and "pond at night" (dark)
     Press T (or the ◐ button) to switch.
     ============================================================ */
  :root {
    --bg: #edf4e4;
    --surface: #ffffff;
    --surface-2: #e2ecd6;
    --text: #1b2a19;
    --muted: #5a6a55;
    --border: #c9d8bd;
    --accent: #2f8f3a;
    --accent-text: #ffffff;
    --gold: #e0a21b;
    --code-bg: #16201a;
    --code-text: #e8f1e3;
    --correct: #23883a;
    --correct-bg: #d9f2dd;
    --wrong: #cc3b3b;
    --wrong-bg: #fbe1e1;
    --ghost: 0.1;
    --sans: "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #0e1915;
    --surface: #16241f;
    --surface-2: #1f322b;
    --text: #e7f1e9;
    --muted: #9cb3a6;
    --border: #2c443b;
    --accent: #6cd47a;
    --accent-text: #0e1915;
    --gold: #f2c14e;
    --code-bg: #08100d;
    --correct: #5ee07a;
    --correct-bg: #143923;
    --wrong: #ff7b7b;
    --wrong-bg: #3e1b1b;
    --ghost: 0.13;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1915;
      --surface: #16241f;
      --surface-2: #1f322b;
      --text: #e7f1e9;
      --muted: #9cb3a6;
      --border: #2c443b;
      --accent: #6cd47a;
      --accent-text: #0e1915;
      --gold: #f2c14e;
      --code-bg: #08100d;
      --correct: #5ee07a;
      --correct-bg: #143923;
      --wrong: #ff7b7b;
      --wrong-bg: #3e1b1b;
      --ghost: 0.13;
    }
  }

  /* Everything is sized in rem, and rem grows with the screen,
     so the page looks the same on a laptop or a huge board. */
  html { font-size: clamp(13px, 1.1vw, 52px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.6rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .brand { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
  .brand .dot { width: 0.9rem; height: 0.9rem; border-radius: 50%; background: var(--accent); }
  .where { flex: 1; text-align: center; color: var(--muted); font-size: 1rem; }
  .where strong { color: var(--text); }
  .tools { display: flex; gap: 0.4rem; }
  .tool {
    min-width: 2.6rem; height: 2.6rem; padding: 0 0.8rem;
    font-size: 1.05rem; font-weight: 700;
    border-radius: 0.6rem; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); cursor: pointer;
  }
  .tool:hover { filter: brightness(1.06); }
  .tool.next { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .tool.pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
    50% { box-shadow: 0 0 0 0.5rem color-mix(in srgb, var(--accent) 0%, transparent); }
  }

  /* ---------- Question slide ---------- */
  #app-stage { min-height: 0; }
  .slide {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.5fr);
    gap: 1.5rem;
    padding: 1.2rem 1.5rem;
    min-height: 0;
  }
  .question {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    min-height: 0;
    overflow: auto;
  }
  .chips { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip {
    font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0.25rem 0.75rem; border-radius: 999px;
    background: var(--surface-2); color: var(--muted);
  }
  .chip.part { background: var(--accent); color: var(--accent-text); }
  .prompt { font-size: 2.1rem; line-height: 1.15; margin: 0; }

  .work { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0.9rem; }
  .panel-label {
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 0.3rem;
  }
  pre.code {
    margin: 0;
    padding: 1rem 1.2rem;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 0.8rem;
    font: 1.12rem/1.5 var(--mono);
    overflow-x: auto;
    white-space: pre;
  }
  .code .kw { color: #d4a5ff; }
  .code .str { color: #b8e986; }
  .code .num { color: #ffab70; }
  .code .com { color: #7f948a; font-style: italic; }
  .code .tag { color: #7cc4ff; }
  .code .blank {
    display: inline-block; min-width: 3.5em; text-align: center;
    border: 2px dashed var(--gold); border-radius: 0.35rem;
    color: var(--gold); font-weight: 700; line-height: 1.2;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.45; } }
  .code .filled {
    background: color-mix(in srgb, var(--correct) 30%, transparent);
    outline: 2px solid var(--correct); border-radius: 0.3rem; padding: 0 0.15em;
    color: #ffffff; font-weight: 700;
  }

  .output {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    padding: 0.8rem 1rem;
    min-height: 6rem;
    font: 1.1rem/1.45 var(--mono);
    overflow: auto;
  }
  .output .waiting {
    height: 100%; min-height: 4rem; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-family: var(--sans); font-size: 1rem;
  }
  .output .waiting b { display: block; font-size: 2.4rem; color: var(--border); }
  .output .line { white-space: pre-wrap; word-break: break-word; padding: 0.1rem 0; border-bottom: 1px solid var(--surface-2); }
  .output .line:last-child { border-bottom: 0; }
  .output .line.err { color: var(--wrong); }
  .output .line.pop { animation: slideIn 0.35s ease-out both; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(0.4rem); } }
  .mini-console { margin-top: 0.6rem; padding-top: 0.5rem; border-top: 1px dashed var(--border); }

  /* The live "page" box for DOM questions */
  .page { font-family: var(--sans); font-size: 1.15rem; }
  .page h2 { margin: 0.1rem 0 0.3rem; font-size: 1.5rem; }
  .page ul { margin: 0.2rem 0; padding-left: 1.4rem; }
  .page p { margin: 0.35rem 0; }
  .page button, .page input {
    font: inherit; padding: 0.35rem 0.8rem; border-radius: 0.5rem;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  .page button { cursor: pointer; font-weight: 700; }
  .page form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .page .box { padding: 1rem; border: 2px solid var(--border); border-radius: 0.6rem; text-align: center; transition: all 0.3s; }
  .page .glow { background: var(--gold); color: #1b1b1b; border-color: var(--gold); box-shadow: 0 0 1.2rem var(--gold); }
  .page .caption { color: var(--muted); font-size: 0.85rem; }
  .page img { width: 6rem; height: 6rem; display: block; }

  /* ---------- Answer buttons ---------- */
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .answer {
    display: flex; align-items: center; gap: 0.9rem;
    min-height: 4.6rem; padding: 0.7rem 1rem;
    text-align: left;
    font: 600 1.3rem/1.3 var(--mono);
    border-radius: 0.9rem;
    border: 3px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s, background 0.2s, border-color 0.2s, opacity 0.3s;
  }
  .answer:hover { border-color: var(--accent); transform: translateY(-2px); }
  .answer .key {
    flex: none; display: grid; place-items: center;
    width: 2.4rem; height: 2.4rem; border-radius: 0.6rem;
    background: var(--surface-2); font: 800 1.2rem var(--sans); color: var(--muted);
  }
  .answer.correct { background: var(--correct-bg); border-color: var(--correct); }
  .answer.correct .key { background: var(--correct); color: var(--surface); }
  .answer.wrong { background: var(--wrong-bg); border-color: var(--wrong); animation: shake 0.4s; }
  .answer.wrong .key { background: var(--wrong); color: var(--surface); }
  .answer.dim { opacity: 0.4; }
  .answers.done .answer { cursor: default; transform: none; }
  @keyframes shake {
    20%, 60% { transform: translateX(-0.5rem); }
    40%, 80% { transform: translateX(0.5rem); }
  }

  .feedback {
    min-height: 3.2rem;
    font-size: 1.35rem; line-height: 1.35;
    padding: 0.7rem 1rem; border-radius: 0.8rem;
  }
  .feedback:empty { visibility: hidden; }
  .feedback.good { background: var(--correct-bg); border-left: 0.4rem solid var(--correct); }
  .feedback.bad { background: var(--wrong-bg); border-left: 0.4rem solid var(--wrong); }
  .feedback .star { color: var(--gold); font-weight: 800; white-space: nowrap; }
  .feedback code, .prompt code { font-family: var(--mono); font-size: 0.92em; }

  /* ---------- Frog panel ---------- */
  .frog-panel {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 1.2rem;
    padding: 1rem;
    min-height: 0;
  }
  .frog-name { font-size: 1.6rem; font-weight: 800; margin: 0; }
  .builds { color: var(--muted); font-size: 1rem; margin: 0.2rem 0 0; text-align: center; }
  .builds strong { color: var(--accent); }
  .frog-slot { flex: 1; min-height: 0; width: 100%; position: relative; }
  #app-frog { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .progress { width: 100%; margin-top: 0.6rem; }
  .bar { display: grid; grid-template-columns: repeat(21, 1fr); gap: 0.2rem; }
  .bar span { height: 0.9rem; border-radius: 0.25rem; background: var(--surface-2); }
  .bar span.part2 { background: color-mix(in srgb, var(--gold) 18%, var(--surface-2)); }
  .bar span.on { background: var(--accent); }
  .bar span.on.part2 { background: var(--gold); }
  .bar span.here { outline: 2px solid var(--text); outline-offset: 1px; }
  .count { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--muted); margin-top: 0.35rem; }
  .count strong { color: var(--text); }

  .toast {
    position: absolute; top: 30%; left: 50%;
    transform: translateX(-50%);
    background: var(--accent); color: var(--accent-text);
    font-size: 1.6rem; font-weight: 800;
    padding: 0.5rem 1.2rem; border-radius: 999px;
    pointer-events: none;
    animation: toast 1.8s ease-out forwards;
  }
  @keyframes toast {
    0% { opacity: 0; transform: translate(-50%, 1rem) scale(0.8); }
    15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
    70% { opacity: 1; transform: translate(-50%, -0.5rem) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -2rem) scale(1); }
  }

  /* Frog pieces: faint "blueprint" until built */
  .piece { opacity: var(--ghost); filter: grayscale(1); transition: opacity 0.4s, filter 0.4s; }
  .piece.built { opacity: 1; filter: none; }
  .piece.just-built { animation: build 0.7s cubic-bezier(0.3, 1.6, 0.5, 1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes build {
    0% { transform: scale(0.3) translateY(-30%); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* ---------- Title and finale ---------- */
  .splash {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 0.8fr);
    align-items: center;
    gap: 2rem;
    padding: 2rem 4rem;
  }
  .splash h1 { font-size: 4.6rem; line-height: 1; margin: 0 0 1rem; }
  .splash h1 span { color: var(--accent); }
  .splash p { font-size: 1.5rem; line-height: 1.4; margin: 0.5rem 0; color: var(--muted); max-width: 32ch; }
  .splash p strong { color: var(--text); }
  .splash .frog-slot { height: calc(100vh - 9rem); }
  .big-btn {
    margin-top: 1.5rem; margin-right: 0.6rem;
    font-size: 1.6rem; font-weight: 800;
    padding: 0.9rem 2.2rem; border-radius: 1rem; border: 0;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  .big-btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .keys { margin-top: 2rem; font-size: 1rem; color: var(--muted); line-height: 1.8; }
  kbd {
    font: 700 0.9rem var(--mono); padding: 0.1rem 0.45rem;
    border: 1px solid var(--border); border-bottom-width: 3px; border-radius: 0.35rem; background: var(--surface);
    color: var(--text);
  }
  .missing { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.8rem; }
  .missing button { font-size: 1rem; padding: 0.3rem 0.7rem; border-radius: 0.5rem; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }

  .confetti { position: fixed; width: 0.7rem; height: 0.9rem; border-radius: 0.15rem; pointer-events: none; z-index: 10; }

  /* ---------- Smaller screens (laptop preview, phone) ---------- */
  @media (max-width: 900px) {
    html { font-size: 14px; }
    body { overflow: auto; height: auto; }
    .slide, .splash { grid-template-columns: 1fr; height: auto; padding: 1rem 16px; }
    .work, .answers { grid-template-columns: 1fr; }
    .frog-panel { height: 70vh; }
    .splash .frog-slot { height: 55vh; }
    .splash h1 { font-size: 3rem; }
    .where { display: none; }
  }
</style>
</head>

<header class="topbar">

  <div class="where" id="app-where"></div>
  <div class="tools">

    <button class="tool next" id="app-next" type="button" title="Next (→)">Next →</button>

    <button class="tool" id="app-full" type="button" title="Full screen (F)">⛶</button>
    <button class="tool" id="app-reset" type="button" title="Start over">↺</button>
  </div>
</header>

<main id="app-stage"></main>

<script>
// ================================================================

// ================================================================

const QUESTIONS = [

  {
    topic: "Objects", piece: "spots", pieceName: "Spots",
    prompt: "What fills the blank to print <code>Ribbit</code>?",
    code: `const frog = { name: "Ribbit", lives: 9 };
console.log(___);`,
    options: [
      { label: "frog.name", correct: true },
      { label: "frog[name]", why: "Without quotes, JavaScript looks for a variable called name. It would need <code>frog[\"name\"]</code>." },
      { label: "name", why: "There's no variable called name. It lives <em>inside</em> frog." },

  // ---------------- PART 2: THE DOM ----------------
  {
    topic: "Linking your script", piece: "cape", pieceName: "Cape",
    prompt: "Which attribute makes the script wait until the page has loaded?",

    run: false,
    code: `<head>

</head>`,
    options: [
      { label: "wait", why: "Not a real attribute. The browser just ignores it." },

    page: `<h2 id="title">Hello</h2>`,

      { label: "<span style=\"font-family:var(--sans)\"><b>Hi</b> frog</span> <small style=\"font-family:var(--sans)\">(Hi in bold)</small>", why: "That's what <code>innerHTML</code> would do." },

      { label: "&lt;b&gt;Hi&lt;/b&gt; frog", correct: true },
      { label: "An error", why: "Valid code. <code>textContent</code> accepts any text." },
    ],
    explain: "<code>textContent</code> shows text exactly as written, tags and all. <code>innerHTML</code> would make Hi bold.",
  },
  {
    topic: "Classes", piece: "pauldrons", pieceName: "Shoulder armour",
    prompt: "Which method fills the blank?",
    page: `<div id="card" class="box">Frog card</div>
<p class="caption">We want the glow class added if it's missing, removed if it's there.</p>`,
    code: `const card = document.querySelector("#card");
card.classList.___("glow");`,
    options: [
      { label: "add", why: "<code>add</code> only adds. It never removes." },

___`,

  {
    topic: "Events", piece: "shield", pieceName: "Shield",

btn.addEventListener("click", ___);`,

  {

});`,

const PART_1_COUNT = 12;   // questions 1–12 build the frog, 13–21 make him a knight
const TOTAL = QUESTIONS.length;

// ================================================================
// State: which questions are answered (saved so a page refresh
// doesn't lose the class's progress)
// ================================================================
const SAVE_KEY = "js-quest-frog-v1";
let answered = {};        // { questionIndex: { firstTry: true/false } }
let wrongTries = {};      // wrong answers tried on each question (not saved)
let slide = 0;            // 0 = title, 1–21 = questions, 22 = finale

function load() {
  try { answered = JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch { answered = {}; }
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(answered)); } catch { /* storage blocked: just don't save */ }
}

// ================================================================
// Drawing slides
// ================================================================
const stageEl = document.querySelector("#app-stage");
const frogSvg = document.querySelector("#app-frog");
const whereEl = document.querySelector("#app-where");
const nextBtn = document.querySelector("#app-next");

function builtCount() { return Object.keys(answered).length; }
function firstTryCount() { return Object.values(answered).filter((a) => a.firstTry).length; }

function render() {
  nextBtn.classList.remove("pulse");
  if (slide === 0) renderTitle();
  else if (slide > TOTAL) renderFinale();
  else renderQuestion(slide - 1);
  stageEl.scrollTop = 0;
}

function renderTitle() {
  whereEl.innerHTML = "";
  nextBtn.textContent = "Start →";
  stageEl.innerHTML = `
    <section class="splash">
      <div>
        <h1>JavaScript<br><span>Quest</span></h1>
        <p>Every right answer builds a piece of <strong>Sir Hops-a-Lot</strong>, the frog knight.</p>
        <p><strong>Part 1</strong> builds the frog. <strong>Part 2</strong> (the DOM) arms him for battle.</p>
        <button class="big-btn" type="button" data-go="1">${builtCount() ? "Continue" : "Start the quest"}</button>
        <div class="keys">
          <kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> pick an answer &nbsp;·&nbsp;
          <kbd>→</kbd> next &nbsp;·&nbsp; <kbd>←</kbd> back<br>
          <kbd>F</kbd> full screen &nbsp;·&nbsp; <kbd>T</kbd> light / dark &nbsp;·&nbsp; <kbd>Esc</kbd> leave a text box
        </div>
      </div>
      <div class="frog-slot"></div>
    </section>`;
  stageEl.querySelector(".frog-slot").append(frogSvg);
}

function renderFinale() {
  whereEl.innerHTML = "<strong>Quest complete</strong>";
  nextBtn.textContent = "Next →";
  const built = builtCount();
  const done = built === TOTAL;
  const missing = QUESTIONS.map((q, i) => i).filter((i) => !answered[i]);
  stageEl.innerHTML = `
    <section class="splash">
      <div>
        <h1>${done ? "Sir Hops-a-Lot<br><span>is ready!</span>" : "Almost<br><span>there…</span>"}</h1>
        <p>${done
          ? "You built the whole frog knight. He's ready to fight bugs (the code kind)."
          : `${built} of ${TOTAL} pieces built. These questions still need answering:`}</p>
        ${done ? "" : `<div class="missing">${missing.map((i) => `<button type="button" data-go="${i + 1}">${i + 1}. ${QUESTIONS[i].topic}</button>`).join("")}</div>`}
        <p>⭐ <strong>${firstTryCount()} of ${built}</strong> answered on the first try.</p>
        <button class="big-btn" type="button" data-go="1">Review</button>
        <button class="big-btn secondary" type="button" data-reset>Start over</button>
      </div>
      <div class="frog-slot"></div>
    </section>`;
  stageEl.querySelector(".frog-slot").append(frogSvg);
  if (done) setTimeout(() => confetti(innerWidth * 0.7, innerHeight * 0.4, 140), 300);
}

function renderQuestion(index) {
  const q = QUESTIONS[index];
  const part = index < PART_1_COUNT ? "Part 1 · Fundamentals" : "Part 2 · The DOM";
  whereEl.innerHTML = `${part} &nbsp;·&nbsp; <strong>Question ${index + 1} of ${TOTAL}</strong>`;
  nextBtn.textContent = index === TOTAL - 1 ? "Finish →" : "Next →";

  stageEl.innerHTML = `
    <section class="slide">
      <div class="question">
        <div class="chips">
          <span class="chip part">${index < PART_1_COUNT ? "Part 1" : "Part 2"}</span>
          <span class="chip">${q.topic}</span>
        </div>
        <h2 class="prompt">${q.prompt}</h2>
        <div class="work">
          <div>
            <p class="panel-label">${q.lang === "html" ? "HTML" : "JavaScript"}</p>
            <pre class="code">${highlight(q.code, q.lang)}</pre>
          </div>
          <div>
            <p class="panel-label">${q.page ? "The page" : q.run === false ? "" : "Console"}</p>
            <div class="output">
              ${q.page
                ? `<div class="page" id="app-page">${q.page}</div><div class="mini-console" hidden></div>`
                : q.run === false
                  ? `<div class="waiting"><span><b>&lt;/&gt;</b>No output: this one's about HTML</span></div>`
                  : `<div class="waiting"><span><b>?</b>Output appears after the right answer</span></div>`}
            </div>
          </div>
        </div>
        <div class="answers">
          ${q.options.map((o, i) => `
            <button class="answer" type="button" data-answer="${i}">
              <span class="key">${"ABCD"[i]}</span><span>${o.label}</span>
            </button>`).join("")}
        </div>
        <div class="feedback" aria-live="polite"></div>
      </div>

      <aside class="frog-panel">
        <h2 class="frog-name">Sir Hops-a-Lot</h2>
        <p class="builds">${answered[index] ? "Built:" : "This answer builds:"} <strong>${q.pieceName}</strong></p>
        <div class="frog-slot"></div>
        <div class="progress">
          <div class="bar">${QUESTIONS.map((_, i) =>
            `<span class="${i >= PART_1_COUNT ? "part2" : ""} ${answered[i] ? "on" : ""} ${i === index ? "here" : ""}"></span>`).join("")}</div>
          <div class="count"><span><strong class="built-count">${builtCount()}</strong> / ${TOTAL} pieces</span><span>⭐ <strong class="star-count">${firstTryCount()}</strong> first try</span></div>
        </div>
      </aside>
    </section>`;
  stageEl.querySelector(".frog-slot").append(frogSvg);

  // Coming back to an answered question: show it already solved
  if (answered[index]) showCorrect(index, false);
}

// ================================================================
// Answering
// ================================================================
function choose(optionIndex) {
  if (slide < 1 || slide > TOTAL) return;
  const index = slide - 1;
  if (answered[index] && document.querySelector(".answers.done")) return;
  const q = QUESTIONS[index];
  const option = q.options[optionIndex];
  if (!option) return;
  const button = document.querySelector(`[data-answer="${optionIndex}"]`);

  if (option.correct) {
    const firstTry = !wrongTries[index];
    const isNew = !answered[index];
    if (isNew) {
      answered[index] = { firstTry };
      save();
    }
    showCorrect(index, isNew);
  } else {
    wrongTries[index] = (wrongTries[index] || 0) + 1;
    button.classList.remove("wrong");
    void button.offsetWidth;   // restart the shake animation
    button.classList.add("wrong");
    const fb = document.querySelector(".feedback");
    fb.className = "feedback bad";
    fb.innerHTML = `<strong>Not quite.</strong> ${option.why || "Try another one!"}`;
  }
}

function showCorrect(index, isNew) {
  const q = QUESTIONS[index];
  const correctIndex = q.options.findIndex((o) => o.correct);
  const correct = q.options[correctIndex];

  document.querySelector(".answers").classList.add("done");
  document.querySelectorAll(".answer").forEach((b, i) => {
    b.classList.remove("wrong");
    b.classList.toggle("correct", i === correctIndex);
    b.classList.toggle("dim", i !== correctIndex);
  });

  // Fill in the blank in the code
  document.querySelector("pre.code").innerHTML = highlight(q.code, q.lang, plain(correct.label));

  const fb = document.querySelector(".feedback");
  fb.className = "feedback good";
  const star = answered[index].firstTry ? ` <span class="star">⭐ First try!</span>` : "";
  fb.innerHTML = `<strong>Yes!</strong> ${q.explain}${star}`;

  runQuestion(q, plain(correct.label), isNew);

  // Build the piece
  document.querySelector(".builds").innerHTML = `Built: <strong>${q.pieceName}</strong>`;
  document.querySelectorAll(".bar span")[index].classList.add("on");
  document.querySelector(".built-count").textContent = builtCount();
  document.querySelector(".star-count").textContent = firstTryCount();
  if (isNew) {
    buildPiece(q.piece, true);
    const panel = document.querySelector(".frog-panel");
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.textContent = `+ ${q.pieceName}!`;
    panel.append(toast);
    setTimeout(() => toast.remove(), 1900);
    const r = panel.getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + r.height * 0.45, 40);
    nextBtn.classList.add("pulse");
  }
}

function buildPiece(id, animate) {
  document.querySelectorAll(`[data-piece="${id}"]`).forEach((g) => {
    g.classList.add("built");
    if (animate) {
      g.classList.add("just-built");
      setTimeout(() => g.classList.remove("just-built"), 800);
    }
  });
}

// Turn a button label like "Hello<br>Class" or "&lt;b&gt;" into plain text
function plain(html) {
  const div = document.createElement("div");
  div.innerHTML = html.replace(/<br>/g, "\n");
  return div.textContent;
}

// ================================================================
// Running the real code once the right answer is chosen
// ================================================================
function runQuestion(q, answerText, animate) {
  if (q.run === false) return;
  const output = document.querySelector(".output");
  const logTo = q.page ? output.querySelector(".mini-console") : output;
  if (!q.page) output.innerHTML = "";

  const lines = [];
  const show = (text, isError) => {
    lines.push(text);
    if (q.page) logTo.hidden = false;
    const line = document.createElement("div");
    line.className = "line" + (isError ? " err" : "") + (animate ? " pop" : "");
    line.style.animationDelay = `${(lines.length - 1) * 0.12}s`;
    line.textContent = text;
    logTo.append(line);
  };
  const fakeConsole = {
    log: (...values) => show(values.map((v) => format(v, 0, true)).join(" ")),
  };

  const body = [q.before || "", (q.runCode || q.code).replace("___", answerText), q.after || ""].join("\n");
  try {
    new Function("console", "FROG_PIC", body)(fakeConsole, FROG_PIC);
  } catch (error) {
    show(`${error.name}: ${error.message}`, true);
  }
}

// Show values the way the browser console does
function format(value, depth, topLevel) {
  if (typeof value === "string") return topLevel ? value : JSON.stringify(value);
  if (value === null) return "null";
  if (value === undefined) return "undefined";
  if (typeof value === "function") return `ƒ ${value.name || "anonymous"}()`;
  if (typeof value !== "object") return String(value);
  if (value instanceof Element) return value.outerHTML;
  if (depth > 2) return Array.isArray(value) ? "[…]" : "{…}";
  if (Array.isArray(value)) return `[${value.map((v) => format(v, depth + 1)).join(", ")}]`;
  return `{ ${Object.entries(value).map(([k, v]) => `${k}: ${format(v, depth + 1)}`).join(", ")} }`;
}

// ================================================================
// A tiny syntax highlighter for the code boxes
// ================================================================
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlight(code, lang, fill) {
  const blank = fill === undefined
    ? `<span class="blank">?</span>`
    : `<span class="filled">${escapeHtml(fill)}</span>`;

  if (lang === "html") {
    return escapeHtml(code)
      .replace(/"[^"]*"/g, (m) => `<span class="str">${m}</span>`)
      .replace(/(&lt;\/?)([a-z]+)/g, `$1<span class="tag">$2</span>`)
      .replace("___", blank);
  }

  const pattern = /(\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(const|let|var|function|return|if|else|for|while|of|new|true|false|null|undefined|typeof)\b|\b(\d+(?:\.\d+)?)\b|(___)/g;
  let html = "";
  let last = 0;
  for (const m of code.matchAll(pattern)) {
    html += escapeHtml(code.slice(last, m.index));
    const text = escapeHtml(m[0]);
    if (m[1]) html += `<span class="com">${text}</span>`;
    else if (m[2]) html += `<span class="str">${text}</span>`;
    else if (m[3]) html += `<span class="kw">${text}</span>`;
    else if (m[4]) html += `<span class="num">${text}</span>`;
    else html += blank;
    last = m.index + m[0].length;
  }
  return html + escapeHtml(code.slice(last));
}

// ================================================================
// Confetti
// ================================================================
function confetti(x, y, count) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colours = ["#6cc04a", "#f2c14e", "#e63946", "#3b6fd8", "#ff8fa3", "#4fb3e0"];
  for (let i = 0; i < count; i++) {
    const bit = document.createElement("div");
    bit.className = "confetti";
    bit.style.left = x + "px";
    bit.style.top = y + "px";
    bit.style.background = colours[i % colours.length];
    document.body.append(bit);
    const angle = Math.random() * Math.PI * 2;
    const speed = 120 + Math.random() * 280;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed - 150;
    bit.animate(
      [
        { transform: "translate(0, 0) rotate(0deg)", opacity: 1 },
        { transform: `translate(${dx}px, ${dy + 380}px) rotate(${Math.random() * 720}deg)`, opacity: 0 },
      ],
      { duration: 1300 + Math.random() * 900, easing: "cubic-bezier(0.2, 0.6, 0.4, 1)" }
    ).onfinish = () => bit.remove();
  }
}

// ================================================================
// Navigation and controls
// ================================================================
function go(n) {
  slide = Math.max(0, Math.min(TOTAL + 1, n));
  render();
}

function resetAll() {
  answered = {};
  wrongTries = {};
  save();
  document.querySelectorAll(".piece").forEach((g) => g.classList.remove("built"));
  go(0);
}

document.querySelector("#app-prev").addEventListener("click", () => go(slide - 1));
nextBtn.addEventListener("click", () => go(slide + 1));
document.querySelector("#app-full").addEventListener("click", toggleFullscreen);
document.querySelector("#app-theme").addEventListener("click", toggleTheme);
document.querySelector("#app-reset").addEventListener("click", () => {
  if (confirm("Start over? This takes Sir Hops-a-Lot apart.")) resetAll();
});

// Clicks inside the slide (answer buttons, Start, Review…)
stageEl.addEventListener("click", (event) => {
  const answer = event.target.closest("[data-answer]");
  if (answer) return choose(Number(answer.dataset.answer));
  const goTo = event.target.closest("[data-go]");
  if (goTo) return go(Number(goTo.dataset.go));
  if (event.target.closest("[data-reset]")) resetAll();
});

document.addEventListener("keydown", (event) => {
  // Don't steal keys while someone types in a demo input box
  // (press Esc to leave the box and use the shortcuts again)
  if (event.target.matches("input, textarea")) {
    if (event.key === "Escape") event.target.blur();
    return;
  }
  if (event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key.toLowerCase();
  if (key === "arrowright" || key === "pagedown" || key === " ") { event.preventDefault(); go(slide + 1); }
  else if (key === "arrowleft" || key === "pageup") { event.preventDefault(); go(slide - 1); }
  else if (key === "home") go(0);
  else if (key === "f") toggleFullscreen();
  else if (key === "t") toggleTheme();
  else if ("1234".includes(key) && key.length === 1) choose(Number(key) - 1);
  else if ("abcd".includes(key) && key.length === 1) choose("abcd".indexOf(key));
});

// Demo forms must never reload the page (that would lose your place)
document.addEventListener("submit", (event) => event.preventDefault());

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem(SAVE_KEY + "-theme", root.dataset.theme); } catch {}
}

// ================================================================
// Start
// ================================================================
load();
try {
  const theme = localStorage.getItem(SAVE_KEY + "-theme");
  if (theme) document.documentElement.dataset.theme = theme;
} catch {}
QUESTIONS.forEach((q, i) => { if (answered[i]) buildPiece(q.piece, false); });
render();
</script>
</body>
</html>
